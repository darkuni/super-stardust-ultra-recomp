# Publishes the packages of a finished "Build Windows and Linux" run as a GitHub release, so the
# release holds exactly the build that was tested (Actions > Release > Run workflow).
name: Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID of the Build Windows and Linux run to publish"
        required: true
      tag:
        description: "Release tag (for example v1.0.0)"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          name: stardust-win64-zip
          path: dist
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          name: stardust-linux-x86_64
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -e
          ls -la dist
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)
          gh release create "$TAG" dist/stardust-win64.zip dist/stardust-linux-x86_64.tar.gz \
            --target "$sha" --title "Super Stardust Ultra $TAG" --notes-file packaging/RELEASE-NOTES.md
